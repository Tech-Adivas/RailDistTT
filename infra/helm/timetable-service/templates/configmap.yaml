apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "timetable-service.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "timetable-service.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.env.SPRING_PROFILES_ACTIVE | quote }}
  JAVA_OPTS: {{ .Values.env.JAVA_OPTS | quote }}
  # Management port — exposed separately so Prometheus can scrape without going through the app port
  MANAGEMENT_SERVER_PORT: "8090"
  SERVER_TOMCAT_ACCEPT_COUNT: "200"
  SERVER_TOMCAT_MAX_THREADS: "200"
