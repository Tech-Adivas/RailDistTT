{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "notification-service.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "notification-service.labels" . | nindent 4 }}
  annotations:
    # IRSA: bind this ServiceAccount to the IAM role for AWS API access (e.g., SSM, Secrets Manager).
    # TODO(config): Set serviceAccount.roleArn to the IAM role ARN from Terraform output.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
{{- end }}
