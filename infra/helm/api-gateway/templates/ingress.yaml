apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "api-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    # TODO(config): Set the ACM certificate ARN for your domain (Terraform output: acm_certificate_arn).
    alb.ingress.kubernetes.io/certificate-arn: "PLACEHOLDER_ACM_CERT_ARN"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: "/actuator/health"
    alb.ingress.kubernetes.io/healthcheck-port: "8090"
spec:
  rules:
    # TODO(config): Set to your domain (e.g. api.railway.example.com).
    - host: "PLACEHOLDER_GATEWAY_HOSTNAME"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "api-gateway.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
