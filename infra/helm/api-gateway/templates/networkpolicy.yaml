apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "api-gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "api-gateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow all inbound (ALB forwards from internet)
    - {}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Downstream services within namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - port: 8081
          protocol: TCP
        - port: 8082
          protocol: TCP
        - port: 8083
          protocol: TCP
        - port: 8084
          protocol: TCP
        - port: 8085
          protocol: TCP
    # Redis / ElastiCache
    - ports:
        - port: 6379
          protocol: TCP
    # Vault (for OIDC JWK fetching)
    - ports:
        - port: 8200
          protocol: TCP
    # OIDC issuer (Cognito or external IdP) — HTTPS
    - ports:
        - port: 443
          protocol: TCP
    # OTel collector
    - ports:
        - port: 4318
          protocol: TCP
