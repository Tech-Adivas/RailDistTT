global:
  imageTag: "latest"
  # TODO(config): Set to your ECR registry URL (Terraform output: ecr_registry_url).
  ecrRegistry: "PLACEHOLDER_ECR_REGISTRY"

# Per-service overrides.
# Note: Helm does not evaluate Go templates in values files; image.repository is a literal string.
# At deploy time, override these with:
#   helm upgrade --install railway-platform ./platform \
#     --set global.ecrRegistry=<YOUR_ECR_URL> \
#     --set global.imageTag=<GIT_SHA>
# The CI pipeline should pass these overrides so each subchart picks up the correct image.

timetable-service:
  image:
    # TODO(config): Inject via Vault. Vault path: secret/data/railway/timetable-service/<key>
    repository: "PLACEHOLDER_ECR_REGISTRY/railway-platform/timetable-service"
    tag: "latest"

