# Grafana Tempo configuration for local development.
# Receives OTel traces via gRPC (port 4317) and HTTP (port 4318).
# In production use the Tempo Helm chart with S3 backend.

stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal

compactor:
  compaction:
    block_retention: 168h    # 7 days

metrics_generator:
  registry:
    external_labels:
      source: tempo
      environment: local
  storage:
    path: /tmp/tempo/generator/wal
  processors: [service-graphs, span-metrics]

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
