# Auto-provisioned Grafana dashboard provider.
# Loads dashboard JSON files from /var/lib/grafana/dashboards.

apiVersion: 1

providers:
  - name: Railway Timetable Platform
    orgId: 1
    folder: Railway Timetable Platform
    folderUid: railway-platform
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
