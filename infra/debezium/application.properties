# Debezium Server configuration for the Transactional Outbox relay.
# This file is mounted into the Debezium Server container at /debezium/conf/application.properties.
#
# Debezium reads the PostgreSQL WAL and publishes outbox rows to Kafka.
# See ADR-001 for the rationale behind the Transactional Outbox pattern.

# ── Sink: Kafka ──────────────────────────────────────────────────────────────
debezium.sink.type=kafka
# TODO(config): replace with MSK bootstrap brokers in production.
# Obtain from: Terraform output `msk_bootstrap_brokers_sasl_iam`.
debezium.sink.kafka.producer.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
# TODO(config): replace with Schema Registry URL in production.
debezium.sink.kafka.producer.schema.registry.url=${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
# Enable exactly-once producer semantics.
debezium.sink.kafka.producer.enable.idempotence=true
debezium.sink.kafka.producer.acks=all
debezium.sink.kafka.producer.retries=10

# ── Source: PostgreSQL ───────────────────────────────────────────────────────
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
# TODO(config): replace with RDS writer endpoint in production.
debezium.source.database.hostname=${DB_HOST:postgres}
debezium.source.database.port=${DB_PORT:5432}
debezium.source.database.dbname=${DB_NAME:timetable_db}
# Vault path (production): secret/data/railway/debezium/db-username
debezium.source.database.user=${DB_USER:debezium_user}
# Vault path (production): secret/data/railway/debezium/db-password
debezium.source.database.password=${DB_PASSWORD:debezium_dev_password}
debezium.source.database.server.name=railway-timetable

# Use pgoutput plugin (native PostgreSQL, no extra extensions required).
debezium.source.plugin.name=pgoutput

# Monitor only the outbox table — not the full schema.
debezium.source.table.include.list=public.outbox_events

# ── Outbox Event Router ──────────────────────────────────────────────────────
# Debezium's outbox event router transforms a raw outbox row into a routable
# Kafka event. The aggregate_type column determines the topic.
debezium.source.transforms=outbox
debezium.source.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.source.transforms.outbox.table.field.event.id=id
debezium.source.transforms.outbox.table.field.event.key=aggregate_id
debezium.source.transforms.outbox.table.field.event.payload=payload
debezium.source.transforms.outbox.table.field.event.type=event_type
debezium.source.transforms.outbox.route.by.field=aggregate_type
debezium.source.transforms.outbox.route.topic.replacement=railway.${routedByValue}

# Propagate correlation ID and event metadata as Kafka record headers.
debezium.source.transforms.outbox.table.fields.additional.placement=correlation_id:header,event_type:header,created_at:header

# ── Offset storage ───────────────────────────────────────────────────────────
# Store Debezium offsets in Kafka (survives Debezium restarts without event loss).
debezium.source.offset.storage=org.apache.kafka.connect.storage.KafkaOffsetBackingStore
debezium.source.offset.storage.topic=_debezium_offsets
debezium.source.offset.flush.interval.ms=10000

# ── Schema history ───────────────────────────────────────────────────────────
debezium.source.schema.history.internal=io.debezium.storage.kafka.history.KafkaSchemaHistory
debezium.source.schema.history.internal.kafka.topic=_debezium_schema_history
debezium.source.schema.history.internal.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
