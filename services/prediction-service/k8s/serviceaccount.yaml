# ServiceAccount for the prediction-service pod.
# Annotated with the IAM Role ARN so the Vault Agent (and AWS SDK) can
# assume the correct IAM role via IRSA (IAM Roles for Service Accounts).
#
# TODO(config): Replace PLACEHOLDER_IAM_ROLE_ARN_PREDICTION_SERVICE with the
#               Terraform output: iam_role_arn_prediction_service
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prediction-service
  namespace: railway
  labels:
    app.kubernetes.io/name: prediction-service
    app.kubernetes.io/component: ml-inference
    app.kubernetes.io/part-of: rail-dist-tt
  annotations:
    eks.amazonaws.com/role-arn: "PLACEHOLDER_IAM_ROLE_ARN_PREDICTION_SERVICE"  # TODO(config): Terraform output: iam_role_arn_prediction_service
