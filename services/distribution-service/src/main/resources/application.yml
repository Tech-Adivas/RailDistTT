spring:
  application:
    name: distribution-service

  # ── DataSource ──────────────────────────────────────────────────────────────
  # TODO(config): Vault path secret/distribution-service/db → username, password, url
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:distribution_db}
    username: ${DB_USERNAME:PLACEHOLDER_DB_USERNAME}
    password: ${DB_PASSWORD:PLACEHOLDER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Kafka ────────────────────────────────────────────────────────────────────
  # TODO(config): Vault path secret/distribution-service/kafka → bootstrap-servers
  # TODO(config): Vault path secret/distribution-service/schema-registry → url
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: distribution-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
    producer:
      transaction-id-prefix: distribution-service-tx-
      acks: all
      enable-idempotence: true
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
      specific.avro.reader: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    kafka:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# ── Resilience4j ─────────────────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      kafka-distribution-producer:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      kafka-distribution-producer:
        timeout-duration: 5s

# ── Maintenance jobs ──────────────────────────────────────────────────────────
maintenance:
  processed-events:
    cleanup-cron: "0 0 2 * * *"

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

server:
  port: 8084
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

---
# DEV-ONLY profile
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/distribution_db
    username: dist_user    # DEV-ONLY
    password: dist_pass    # DEV-ONLY

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      schema.registry.url: http://localhost:8081

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://localhost:5432/test_distribution_db
    username: test    # DEV-ONLY
    password: test    # DEV-ONLY

  flyway:
    enabled: true

---
# Kubernetes profile — active when SPRING_PROFILES_ACTIVE=k8s (set by Helm configmap).
# Vault Agent Sidecar writes secrets to /vault/secrets/application.properties.
# Spring Boot loads it via SPRING_CONFIG_IMPORT env var (set in Helm deployment.yaml).
spring:
  config:
    activate:
      on-profile: k8s
  cloud:
    vault:
      # Disable direct Vault connection; Vault Agent Sidecar handles secret injection.
      enabled: false

management:
  server:
    port: 8090
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,readiness,liveness,prometheus,info,metrics
  metrics:
    tags:
      service: distribution-service
      environment: k8s
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      # TODO(config): Update namespace if Grafana Alloy is not in 'monitoring' namespace.
      endpoint: http://alloy.monitoring.svc.cluster.local:4318/v1/traces

logging:
  structured:
    format:
      console: ecs   # Elastic Common Schema JSON — native in Spring Boot 4.x
