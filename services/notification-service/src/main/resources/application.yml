spring:
  application:
    name: notification-service

  # ── DataSource ──────────────────────────────────────────────────────────────
  # TODO(config): Vault path secret/notification-service/db → username, password, url
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    username: ${DB_USERNAME:PLACEHOLDER_DB_USERNAME}
    password: ${DB_PASSWORD:PLACEHOLDER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Kafka ────────────────────────────────────────────────────────────────────
  # TODO(config): Vault path secret/notification-service/kafka → bootstrap-servers
  # TODO(config): Vault path secret/notification-service/schema-registry → url
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
      specific.avro.reader: true

# ── Provider credentials ─────────────────────────────────────────────────────
# TODO(config): All values below from Vault at startup via Spring Cloud Vault.
notification:
  fcm:
    server-key: ${FCM_SERVER_KEY:PLACEHOLDER_FCM_SERVER_KEY}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:PLACEHOLDER_TWILIO_ACCOUNT_SID}
    auth-token: ${TWILIO_AUTH_TOKEN:PLACEHOLDER_TWILIO_AUTH_TOKEN}
    from-number: ${TWILIO_FROM_NUMBER:PLACEHOLDER_TWILIO_FROM_NUMBER}
  sendgrid:
    api-key: ${SENDGRID_API_KEY:PLACEHOLDER_SENDGRID_API_KEY}
    from-address: ${SENDGRID_FROM_ADDRESS:PLACEHOLDER_SENDGRID_FROM_ADDRESS}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    kafka:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# ── Maintenance jobs ──────────────────────────────────────────────────────────
maintenance:
  processed-events:
    cleanup-cron: "0 0 2 * * *"

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

server:
  port: 8085

---
# DEV-ONLY profile
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: notif_user    # DEV-ONLY
    password: notif_pass    # DEV-ONLY

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      schema.registry.url: http://localhost:8081

notification:
