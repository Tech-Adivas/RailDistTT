    server-key: dev-fcm-key          # DEV-ONLY
  twilio:
    account-sid: dev-twilio-sid      # DEV-ONLY
    auth-token: dev-twilio-token     # DEV-ONLY
    from-number: "+10000000000"      # DEV-ONLY
  sendgrid:
    api-key: dev-sendgrid-key        # DEV-ONLY
    from-address: dev@example.com    # DEV-ONLY

