server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------
    # Security headers
    # These are added to every response unless overridden in a specific location.
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------------
    # SPA routing
    # Angular handles client-side routing. Any path that does not match a real
    # file falls back to index.html so the Angular router can take over.
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------------
    # Static asset caching
    # Angular produces content-hashed filenames (e.g. main.abc123.js) so it is
    # safe to cache them for a very long time. Browsers will automatically fetch
    # new files when the hash changes.
    # ---------------------------------------------------------------------------
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------------------------------------------------------------------------
    # index.html — never cache
    # Must always be fetched fresh so the browser picks up new asset hashes
    # after a deployment.
    # ---------------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------------------------------------------------------------------------
    # Health check endpoint
    # Used by the AWS ALB target group health checks and Kubernetes liveness
    # probes without requiring a real application endpoint.
    # ---------------------------------------------------------------------------
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
